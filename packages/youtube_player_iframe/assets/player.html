<!DOCTYPE html>
<html lang="en">
  <head>
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <style>
      html {
        width: 100%;
        height: 100%;
        background-color: black;
        pointer-events: <<pointerEvents>>;
        overscroll-behavior: none; /* iOS 버전에 따라 무시될 수 있음 */
        touch-action: none;        /* iOS에선 기대만큼 안 먹는 경우가 많음 */
      }

      body {
        margin: 0;
        width: 100%;
        height: 100%;
        background-color: black;
        pointer-events: inherit;
        overscroll-behavior: none; /* iOS 버전에 따라 무시될 수 있음 */
        touch-action: none;        /* iOS에선 기대만큼 안 먹는 경우가 많음 */
      }

      .embed-container iframe,
      .embed-container object,
      .embed-container embed {
        position: absolute;
        top: 0;
        left: 0;
        width: 100% !important;
        height: 100% !important;
        pointer-events: inherit;
      }
    </style>
    <title>Youtube Player</title>
  </head>

  <body>
    <div class="embed-container">
      <div id="<<playerId>>"></div>
    </div>

    <script>
      var tag = document.createElement("script");
      tag.src = "https://www.youtube.com/iframe_api";
      var firstScriptTag = document.getElementsByTagName("script")[0];
      firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);

      var platform = "<<platform>>";
      var host = "<<host>>";
      var player;
      var timerId;
      var lastFullscreenState = null;
      var fullscreenStateMonitorId = null;
      var fullscreenStateMonitorBound = false;

      var hideClassNames = <<hideClassNames>>;                // 예: ["ytmSlimMetadataButtonRendererHost", ...]
      var disableClickClassNames = <<disableClickClassNames>>; // 예: ["ytmVideoInfoHost", ...]


      function onYouTubeIframeAPIReady() {
        player = new YT.Player("<<playerId>>", {
          host: host,
          playerVars: <<playerVars>>,
          events: {
            onReady: function (event) {
              handleFullScreenForMobilePlatform();
              sendVideoSize(event);
              sendMessage('Ready', event);
            },
            onStateChange: function (event) {
              clearTimeout(timerId);
              sendMessage('StateChange', event.data);
              if (event.data == 1) {
                timerId = setInterval(function () {
                  var state = {
                    'currentTime': player.getCurrentTime(),
                    'loadedFraction': player.getVideoLoadedFraction()
                  };

                  sendMessage('VideoState', JSON.stringify(state));
                }, 100);
              }
              
            },
            onPlaybackQualityChange: function (event) {
              sendMessage('PlaybackQualityChange', event.data);
            },
            onPlaybackRateChange: function (event) {
              sendMessage('PlaybackRateChange', event.data);
            },
            onApiChange: function (event) {
              sendMessage('ApiChange', event.data);
            },
            onError: function (event) {
              sendMessage('PlayerError', event.data);
            },
            onAutoplayBlocked: function (event) {
              sendMessage('AutoplayBlocked', event.data);
            },
          },
        });
        player.setSize(window.innerWidth, window.innerHeight);
      }

      window.addEventListener('message', (event) => {
        try {
          var data = JSON.parse(event.data);

          if(data.function){
            var rawFunction = data.function.replaceAll('<<quote>>', '"');
            var result = eval(rawFunction);

            if(data.key) {
              var message = {}
              message[data.key] = result
              var messageString = JSON.stringify(message);

              event.source.postMessage(messageString , '*');
            }
          }
        } catch (e) { }
      }, false);

      window.onresize = function () {
        player.setSize(window.innerWidth, window.innerHeight);
      };

      function sendPlatformMessage(message) {
        switch(platform) {
           case 'android':
             <<playerId>>.postMessage(message);
             break;
           case 'ios':
             <<playerId>>.postMessage(message, '*');
             break;
           case 'web':
             window.parent.postMessage(message, '*');
             break;
         }
      }

      function sendMessage(key, data) {
         var message = {};
         message[key] = data;
         message['playerId'] = '<<playerId>>';
         var messageString = JSON.stringify(message);

         sendPlatformMessage(messageString);
      }

      function emitFullscreenState(enabled) {
        enabled = !!enabled;
        if (lastFullscreenState === enabled) return;

        lastFullscreenState = enabled;
        if (platform != 'android') {
          if (enabled) {
            startFullscreenStateMonitor();
          } else {
            stopFullscreenStateMonitor();
          }
        }
        sendMessage('FullscreenChanged', enabled);
      }

      function syncFullscreenState(enabled) {
        lastFullscreenState = !!enabled;

        if (platform != 'android') {
          if (lastFullscreenState) {
            startFullscreenStateMonitor();
          } else {
            stopFullscreenStateMonitor();
          }
        }
      }

      function getVideoData() {
        return prepareDataForPlatform(player.getVideoData());
      }

      function getPlaylist() {
        return prepareDataForPlatform(player.getPlaylist());
      }

      function getAvailablePlaybackRates(){
        return prepareDataForPlatform(player.getAvailablePlaybackRates());
      }

      function prepareDataForPlatform(data) {
        if(platform == 'android') return data;

        return JSON.stringify(data);
      }

      function sendVideoSize(event){
        if (platform != 'web') {
          const videoElement = event.target.getIframe().contentWindow.document.querySelector('video');
          if (videoElement == null) return;
          if (videoElement) {
            videoElement.addEventListener('canplay', () => {
              const videoWidth = videoElement.videoWidth;
              const videoHeight = videoElement.videoHeight;
              sendMessage('VideoSize', { width: videoWidth, height: videoHeight });
            });
          }
        }
      }

      function injectHideStyle(ytDoc) {
        try {
          var style = ytDoc.createElement('style');
        
          var selectors = [];
        
          // Dart에서 배열을 넘겨준 경우
          if (Array.isArray(hideClassNames) && hideClassNames.length > 0) {
            selectors = hideClassNames.map(function (name) {
              return '.' + name;
            });
          } else {
            // 혹시 Dart에서 아무것도 안 넘기면 기본값 (지금 쓰시던 것)
            selectors = [
              '.ytmSlimMetadataButtonRendererHost',
              '.fullscreen-more-videos-endpoint',
              '.ytmPaidContentOverlayHost',
            ];
          }
         
          style.textContent =
            selectors.join(',\n') +
            ` {
              display: none !important;
              visibility: hidden !important;
              pointer-events: none !important;
            }`;
         
          ytDoc.head.appendChild(style);
        } catch (e) {}
      }


      function injectDisableClickStyle(ytDoc) {
        try {
          var style = ytDoc.createElement('style');
        
          var selectors = [];
        
          if (Array.isArray(disableClickClassNames) && disableClickClassNames.length > 0) {
            selectors = disableClickClassNames.map(function (name) {
              return '.' + name;
            });
          } else {
            // 기본값: 지금 쓰고 계신 두 개
            selectors = [
              '.ytmVideoInfoHost',
              '.ytSpecButtonViewModelHost',
            ];
          }
        
          style.textContent =
            selectors.join(',\n') +
            ` {
              pointer-events: none !important;
            }`;
        
          ytDoc.head.appendChild(style);
        } catch (e) {
          // 접근 실패하면 조용히 무시
        }
      }


      function attachFullscreenStateListeners(ytDoc) {
        try {
          if (ytDoc.__ytFullscreenStateBound) return;
          ytDoc.__ytFullscreenStateBound = true;

          var videoElement = ytDoc.querySelector('video');
          if (videoElement != null) {
            videoElement.addEventListener('webkitbeginfullscreen', function () {
              emitFullscreenState(true);
            });

            videoElement.addEventListener('webkitendfullscreen', function () {
              emitFullscreenState(false);
            });
          }
        } catch (e) {
          // 접근 실패하면 조용히 무시
        }
      }


      function readFullscreenState(ytDoc) {
        var videoElement = ytDoc.querySelector('video');

        return !!(
          ytDoc.fullscreenElement ||
          ytDoc.webkitFullscreenElement ||
          (videoElement && videoElement.webkitDisplayingFullscreen)
        );
      }


      function getFullscreenButton(ytDoc) {
        return ytDoc.querySelector(
          '.ytp-fullscreen-button, .icon-button.fullscreen-icon, .fullscreen-icon'
        );
      }


      function inferFullscreenStateFromButton(ytDoc) {
        var button = getFullscreenButton(ytDoc);
        if (!button) return null;

        var classText = [button.className || '', button.innerHTML || '']
          .join(' ')
          .toLowerCase();

        if (
          classText.indexOf('fullscreen-exit') >= 0 ||
          classText.indexOf('exit-icon') >= 0
        ) {
          return true;
        }

        if (classText.indexOf('fullscreen-icon') >= 0) {
          return false;
        }

        var labelText = [
          button.getAttribute('title') || '',
          button.getAttribute('aria-label') || '',
        ]
          .join(' ')
          .toLowerCase();

        if (
          labelText.indexOf('exit fullscreen') >= 0 ||
          labelText.indexOf('exit full screen') >= 0 ||
          labelText.indexOf('전체화면 종료') >= 0
        ) {
          return true;
        }

        if (
          labelText.indexOf('fullscreen') >= 0 ||
          labelText.indexOf('full screen') >= 0 ||
          labelText.indexOf('전체화면') >= 0
        ) {
          return false;
        }

        return null;
      }


      function attachFullscreenButtonObserver(ytDoc) {
        try {
          if (ytDoc.__ytFullscreenButtonObserverBound) return;
          ytDoc.__ytFullscreenButtonObserverBound = true;

          var buttonObserver = null;

          var syncFromButton = function () {
            var inferredState = inferFullscreenStateFromButton(ytDoc);
            if (inferredState !== null) {
              emitFullscreenState(inferredState);
            }
          };

          var observeButton = function () {
            var button = getFullscreenButton(ytDoc);
            if (!button || ytDoc.__ytObservedFullscreenButton === button) {
              syncFromButton();
              return;
            }

            ytDoc.__ytObservedFullscreenButton = button;

            if (buttonObserver != null) {
              buttonObserver.disconnect();
            }

            buttonObserver = new MutationObserver(syncFromButton);
            buttonObserver.observe(button, {
              subtree: true,
              childList: true,
              attributes: true,
              attributeFilter: ['class', 'title', 'aria-label'],
            });

            syncFromButton();
          };

          var rootObserver = new MutationObserver(observeButton);
          rootObserver.observe(ytDoc.body, {
            subtree: true,
            childList: true,
            attributes: true,
            attributeFilter: ['class', 'title', 'aria-label'],
          });

          observeButton();
        } catch (e) {
          // 접근 실패하면 조용히 무시
        }
      }


      function attachFullscreenStateMonitor(ytDoc) {
        try {
          if (fullscreenStateMonitorBound) return;
          fullscreenStateMonitorBound = true;

          window.addEventListener('resize', function () {
            if (fullscreenStateMonitorId == null) return;
            emitFullscreenState(readFullscreenState(ytDoc));
          });

          document.addEventListener('visibilitychange', function () {
            if (fullscreenStateMonitorId == null) return;
            emitFullscreenState(readFullscreenState(ytDoc));
          });
        } catch (e) {
          // 접근 실패하면 조용히 무시
        }
      }


      function startFullscreenStateMonitor() {
        if (fullscreenStateMonitorId != null) return;

        fullscreenStateMonitorId = setInterval(function () {
          var ytFrame = document.getElementsByTagName('iframe')[0];
          if (!ytFrame || !ytFrame.contentWindow) return;

          try {
            emitFullscreenState(readFullscreenState(ytFrame.contentWindow.document));
          } catch (e) {
            // 접근 실패하면 조용히 무시
          }
        }, 250);
      }


      function stopFullscreenStateMonitor() {
        if (fullscreenStateMonitorId == null) return;

        clearInterval(fullscreenStateMonitorId);
        fullscreenStateMonitorId = null;
      }


      function handleFullScreenForMobilePlatform() {
        if(platform != 'web') {
          var ytFrame = document.getElementsByTagName('iframe')[0].contentWindow.document;
          var youtubeButton = ytFrame.getElementsByClassName('ytp-youtube-button ytp-button yt-uix-sessionlink')[0];
          injectDisableClickStyle(ytFrame);
          injectHideStyle(ytFrame);

          if (platform != 'android') {
            attachFullscreenStateListeners(ytFrame);
            attachFullscreenStateMonitor(ytFrame);

            if (lastFullscreenState === null) {
              lastFullscreenState = readFullscreenState(ytFrame);
            }

            attachFullscreenButtonObserver(ytFrame);

            ytFrame.addEventListener('click', function(event) {
              var target = event.target;
              if (
                target &&
                typeof target.closest === 'function' &&
                (
                  target.closest('.ytp-fullscreen-button') ||
                  target.closest('.fullscreen-icon') ||
                  target.closest('.ytp-fullscreen-icon') ||
                  target.closest('.ytp-fullscreen-exit-icon')
                )
              ) {
                emitFullscreenState(!lastFullscreenState);
              }
            }, true);
          }
          

    
          
          
          if (youtubeButton != null) {
            const youtubeButtonCopy = document.createElement('a');
            youtubeButtonCopy.textContent = youtubeButton.textContent;
            youtubeButtonCopy.className = youtubeButton.className;
            while (youtubeButton.firstChild) {
              youtubeButtonCopy.appendChild(youtubeButton.firstChild);
            }
            youtubeButton.parentNode.replaceChild(youtubeButtonCopy, youtubeButton);

            youtubeButtonCopy.onclick = function() {
              sendMessage('YoutubeButtonPressed', 'YoutubeButtonPressed');
            };
        }
        }
      }
    </script>
  </body>
</html>
